<html>
    <head>
        <title>Project LEER, Louka en Storm</title>

        <link rel="stylesheet" href="./Project_LEER_Leerkracht_Inloggen.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="body-div">
            <div class="back-div">
                <img class="background" src="../../Project_LEER_foto's/cgs_school.jpg">
            </div>

            <img class="Logo" src="../../Project_LEER_foto's/Logo.png">

            <p class="Welkom">Log in</p>

            <p class="uitleg">Geef jouw gegevens in (leerkracht)</p>

            <div class="keuze-div">

                <img src="../../Project_LEER_foto's/cgs_logo.png" class="logo_CGS">
                <form method="POST" action="/inloggen" class="form" id="inlogform">
                    <input type="text" placeholder="E-mail" class="e-mail" id="e-mail" name="e-mail">
                    <input type="password" placeholder="Wachtwoord" class="wachtwoord" id="wachtwoord" name="wachtwoord">
                </form>
                <button type="submit" form="inlogform" class="inlogbutton">Inloggen</button>
            </div>
        </div>
    </body>
</html>
